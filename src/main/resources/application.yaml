spring:
  application:
    name: ecom-application
  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
management:
   endpoints:
     web:
       exposure:
         include: '*'
   endpoint:
     health:
       show-details: always
   info:
     env:
       enabled: true
info:
  app:
    name: MyNewEcomApp
    description: App build using spring boot 4.1.1
    version: 1.0.0